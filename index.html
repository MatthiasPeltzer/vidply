<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VidPly - A universal, accessible video and audio player with full keyboard navigation, captions, transcripts, and WCAG compliance.">
  <title>VidPly - Universal, Accessible Video Player</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta http-equiv="refresh" content="0; url=./demo/">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #60a5fa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 600px;
      text-align: center;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
    }
    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .tagline {
      font-size: 20px;
      margin-bottom: 40px;
      opacity: 0.95;
    }
    .redirect-message {
      font-size: 16px;
      opacity: 0.8;
      margin-top: 20px;
    }
    .cta-link {
      display: inline-block;
      background: white;
      color: #1e3a8a;
      padding: 15px 40px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cta-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .cta-link:focus {
      outline: 3px solid white;
      outline-offset: 4px;
    }

    footer {
      color: white;
      margin-top: 40px;
      opacity: 0.8;
      text-align: center;
    }

    footer p {
      color: #ffffff;
      margin: 8px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <img src="favicon.svg" alt="VidPly Logo" class="logo">
    <h1>VidPly</h1>
    <p class="tagline">Universal, Accessible Video Player</p>
    <nav aria-label="Main navigation">
      <a href="./demo/" class="cta-link">View Demos</a>
    </nav>
    <p class="redirect-message" role="status" aria-live="polite">Redirecting to demos in a moment...</p>
  </main>

  <footer>
    <p>&copy; 2025 VidPly - Built with Vanilla JavaScript</p>
    <p>Released under GPL-2.0-or-later License</p>
  </footer>
</body>
</html>
