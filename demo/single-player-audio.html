<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VidPly video playlist demo featuring multiple videos with captions, chapters, thumbnails, track navigation, and auto-advance functionality.">
    <title>VidPly - Single Audio</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../dist/vidply.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #000000 0%, #444444 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            margin: 0 auto;
            max-width: 1000px;
        }

        nav {
            margin-bottom: 20px;
        }

        .back-link {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            display: inline-block;
            padding: 8px 16px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .back-link:focus {
            outline: 3px solid white;
            outline-offset: 4px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            align-items: center;
            background: linear-gradient(135deg, #0a406e 0%, #6BA4EE 100%);
            -webkit-background-clip: text;
            background-clip: text;
            display: flex;
            font-size: 56px;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            -webkit-text-fill-color: transparent;
        }

        main {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 20px;
        }

        h2 {
            color: #000;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        p {
            color: #000;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        footer {
            color: #ffffff;
            margin-top: 60px;
            opacity: 0.8;
            text-align: center;
        }

        footer p {
            color: #ffffff;
            margin: 8px 0;
        }

        @media (max-width: 768px) {
            h1 {
                flex-direction: column;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <nav aria-label="Breadcrumb">
        <a href="demo.html" class="back-link">← Back to Main Demo</a>
    </nav>

    <header>

        <h1>
            <img src="../favicon.svg" width="48" height="48" alt="" aria-hidden="true"/>
            <span>VidPly - Single Audio</span>
        </h1>

    </header>

    <main>
        <!-- Audio Demo 3: Everyday Life -->
        <section aria-labelledby="demo-everyday">
            <h2 id="demo-everyday">Audio Player - Simple Audio</h2>
            <p>Lightweight audio player demonstrating straightforward MP3/OGG playback with VidPly defaults.</p>

            <figure>
                <audio
                        id="everyday-audio"
                        data-vidply
                        data-vidply-options='{"speedButton": false}'
                >
                    <source src="media/everyday.mp3" type="audio/mpeg">
                    <source src="media/everyday.ogg" type="audio/ogg">
                </audio>
                <figcaption>Simple audio playback without additional features</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 VidPly - Built with Vanilla JavaScript</p>
        <p>Released under GPL-2.0-or-later License</p>
    </footer>
</div>

<script type="module">
    import '../dist/prod/vidply.esm.min.js';
</script>
</body>
</html>
